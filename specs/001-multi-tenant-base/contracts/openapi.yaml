openapi: 3.0.3
info:
  title: Komanda Multi-Tenant API
  version: 1.0.0
  description: Multi-tenant API contracts for Komanda Core
paths:
  /api/v1/provisioning/tenants:
    post:
      operationId: provisionTenant
      responses:
        '201':
          description: Tenant provisioned successfully
  /api/v1/auth/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      responses:
        '200':
          description: Email verified
  /api/v1/auth/onboarding-handoffs/consume:
    post:
      operationId: consumeOnboardingHandoff
      responses:
        '200':
          description: Handoff consumed
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      responses:
        '200':
          description: Session created
    delete:
      operationId: deleteSession
      responses:
        '204':
          description: Session revoked
  /api/v1/auth/sessions/current:
    get:
      operationId: getCurrentSession
      responses:
        '200':
          description: Current session info
  /api/v1/auth/mobile/sessions:
    post:
      operationId: createMobileSession
      responses:
        '200':
          description: Mobile bearer session created
        '401':
          description: Unauthorized / Invalid credentials
        '422':
          description: Validation failed
  /api/v1/auth/mobile/context:
    get:
      operationId: getMobileContext
      responses:
        '200':
          description: Mobile operational context with authorized active tenants and primary locations
        '401':
          description: Unauthorized / Invalid session
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        '200':
          description: List of accessible tenants
  /api/v1/tenants/{tenantId}/readiness:
    get:
      operationId: getTenantReadiness
      responses:
        '200':
          description: Tenant operational readiness status
  /api/v1/tenants/{tenantId}/settings:
    patch:
      operationId: updateTenantSettings
      responses:
        '200':
          description: Tenant settings updated
  /api/v1/tenants/{tenantId}/integrations/mercadopago:
    get:
      operationId: getMercadoPagoIntegration
      responses:
        '200':
          description: Integration status
    delete:
      operationId: deleteMercadoPagoIntegration
      responses:
        '200':
          description: Integration revoked
  /api/v1/tenants/{tenantId}/integrations/mercadopago/oauth:
    post:
      operationId: initiateMercadoPagoOAuth
      responses:
        '200':
          description: OAuth URL generated
  /api/v1/integrations/mercadopago/oauth/callback:
    get:
      operationId: handleMercadoPagoOAuthCallback
      responses:
        '302':
          description: OAuth callback handled
  /api/v1/integrations/mercadopago/webhooks/{routingKey}:
    post:
      operationId: handleMercadoPagoWebhook
      responses:
        '200':
          description: Webhook processed
  /api/v1/storefronts/{tenantSlug}/catalog:
    get:
      operationId: getStorefrontCatalog
      responses:
        '200':
          description: Public storefront catalog
  /api/v1/storefronts/{tenantSlug}/carts:
    post:
      operationId: createStorefrontCart
      responses:
        '201':
          description: Cart created
  /api/v1/storefronts/{tenantSlug}/carts/{cartId}:
    get:
      operationId: getStorefrontCart
      responses:
        '200':
          description: Cart details
  /api/v1/storefronts/{tenantSlug}/carts/{cartId}/payment-sessions:
    post:
      operationId: createStorefrontPaymentSession
      responses:
        '201':
          description: Payment session created
  /api/v1/tenants/{tenantId}/orders:
    get:
      operationId: listTenantOrders
      responses:
        '200':
          description: List of tenant orders
    post:
      operationId: createTenantOrder
      responses:
        '201':
          description: Order created
  /api/v1/tenants/{tenantId}/orders/{orderId}:
    get:
      operationId: getTenantOrder
      responses:
        '200':
          description: Order details
    patch:
      operationId: transitionTenantOrder
      responses:
        '200':
          description: Order transitioned
  /api/v1/tenants/{tenantId}/orders/events:
    get:
      operationId: streamTenantOrderEvents
      responses:
        '200':
          description: SSE event stream
  /api/v1/tenants/{tenantId}/print-agents:
    post:
      operationId: enrollPrintAgent
      responses:
        '201':
          description: Agent enrolled
  /api/v1/print/jobs/claim:
    post:
      operationId: claimPrintJob
      responses:
        '200':
          description: Print job claimed
  /api/v1/print/jobs/{jobId}/result:
    post:
      operationId: reportPrintJobResult
      responses:
        '200':
          description: Print job result recorded
  /api/v1/tenants/{tenantId}/catalog/categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: List categories
    post:
      operationId: createCategory
      responses:
        '201':
          description: Category created
  /api/v1/tenants/{tenantId}/catalog/categories/{categoryId}:
    patch:
      operationId: updateCategory
      responses:
        '200':
          description: Category updated
    delete:
      operationId: deleteCategory
      responses:
        '200':
          description: Category deleted
  /api/v1/tenants/{tenantId}/catalog/items:
    get:
      operationId: listItems
      responses:
        '200':
          description: List items
    post:
      operationId: createItem
      responses:
        '201':
          description: Item created
  /api/v1/tenants/{tenantId}/catalog/items/{itemId}:
    patch:
      operationId: updateItem
      responses:
        '200':
          description: Item updated
    delete:
      operationId: deleteItem
      responses:
        '200':
          description: Item deleted
  /api/v1/tenants/{tenantId}/catalog/addon-groups:
    post:
      operationId: createAddonGroup
      responses:
        '201':
          description: Addon group created
  /api/v1/tenants/{tenantId}/catalog/addon-groups/{addonGroupId}:
    patch:
      operationId: updateAddonGroup
      responses:
        '200':
          description: Addon group updated
  /api/v1/tenants/{tenantId}/catalog/combos:
    post:
      operationId: createCombo
      responses:
        '201':
          description: Combo created
  /api/v1/tenants/{tenantId}/catalog/combos/{comboId}:
    patch:
      operationId: updateCombo
      responses:
        '200':
          description: Combo updated
  /api/v1/tenants/{tenantId}/media/uploads:
    post:
      operationId: createMediaUpload
      responses:
        '201':
          description: Upload presigned URL created
  /api/v1/tenants/{tenantId}/media/{assetId}/complete:
    post:
      operationId: completeMediaUpload
      responses:
        '200':
          description: Media asset complete
