name: Dispatch ready-order WhatsApp notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch opted-in notifications
        env:
          APP_URL: ${{ secrets.KOMANDA_PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/v1/internal/cron/dispatch-ready-whatsapp"
