name: Core CI

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --audit-level=high

  postgres-integration:
    name: PostgreSQL integration and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: komanda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komanda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      KOMANDA_TEST_MODE: "1"
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/komanda_test
      DATABASE_URL: postgresql://komanda_test_runtime:runtime-test-only@127.0.0.1:5432/komanda_test
      DATABASE_RUNTIME_TEST_USER: komanda_test_runtime
      DATABASE_RUNTIME_TEST_PASSWORD: runtime-test-only
      DATABASE_TEST_INTEGRATION: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run db:verify-roles:test
      - run: npm run test:database-compatibility
      - name: Run integration suites present in this increment
        run: |
          npm run test:integration -- --passWithNoTests
          npm run test:contracts -- --passWithNoTests
          npm run test:tenant-isolation -- --passWithNoTests

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: komanda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komanda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      KOMANDA_TEST_MODE: "1"
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/komanda_test
      DATABASE_URL: postgresql://komanda_test_runtime:runtime-test-only@127.0.0.1:5432/komanda_test
      DATABASE_RUNTIME_TEST_USER: komanda_test_runtime
      DATABASE_RUNTIME_TEST_PASSWORD: runtime-test-only
      DATABASE_TEST_INTEGRATION: "1"
      APP_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENCRYPTION_KEY_VERSION: "1"
      SESSION_SECRET: test-session-secret-key-32-chars-long
      KOMANDA_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      MERCADOPAGO_CLIENT_ID: "3514416644027736"
      MERCADOPAGO_CLIENT_SECRET: vtmRyWI1Tu3VyuXpjvuu9f14Mhal7MJr
      MERCADOPAGO_REDIRECT_URI: http://localhost:3000/api/v1/integrations/mercadopago/oauth/callback
      MERCADOPAGO_WEBHOOK_SECRET: 68901b2db3ef0044f78a4b8b8144cfb8ddffd95f0058c918ee1e1455d9047f16
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run db:verify-roles:test
      - run: npx playwright install --with-deps chromium
      - name: Run browser suite when scenarios exist
        run: |
          if find tests/e2e -type f -name '*.spec.ts' -print -quit 2>/dev/null | grep -q .; then
            npm run test:e2e
          else
            echo "No browser scenarios in this increment."
          fi
