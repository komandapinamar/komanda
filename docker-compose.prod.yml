# ---------------------------------------------------------------------------
# Komanda Core — producción sobre VPS.
#
# Antes del primer arranque, aplicar las migraciones una sola vez:
#   docker compose run --rm web npm run db:prepare
# (con DATABASE_DIRECT_URL apuntando al rol de migración de Supabase).
#
# Env requerido: DATABASE_URL, DATABASE_DIRECT_URL, DATABASE_RUNTIME_PASSWORD,
# APP_ENCRYPTION_KEY_BASE64, OBJECT_STORAGE_*, MERCADOPAGO_*, SESSION_SECRET,
# IDENTITY_VERIFICATION_* ... ver src/.env.production.example.
# ---------------------------------------------------------------------------

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - fastify

  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./src/.env.production
    expose:
      - "3000"

  fastify:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: ["npm", "run", "start:fastify"]
    restart: unless-stopped
    env_file:
      - ./src/.env.production
    expose:
      - "3001"

  worker-outbox:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: ["npm", "run", "outbox:dispatch"]
    restart: unless-stopped
    env_file:
      - ./src/.env.production

  worker-reconcile:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: ["npm", "run", "payments:reconcile"]
    restart: unless-stopped
    env_file:
      - ./src/.env.production

volumes:
  caddy_data:
  caddy_config:
